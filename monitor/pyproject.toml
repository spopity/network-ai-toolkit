[project]
name = "network-ai"
version = "0.1.0"
description = "Router diagnostics collector and AI analysis agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3.0.0",
  "PyYAML>=6.0",
  "requests>=2.28.0",
  "python-dotenv>=1.0.0",
  "google-auth>=2.20.0",
  "Flask>=3.0.0",
  "waitress>=3.0.0",
  "psycopg2-binary>=2.9.0",
  "claude-agent-sdk>=0.2.178",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Router/AdGuard/Postgres calls are best-effort by design (a failed archive write must
# never fail a check), so broad `except Exception` handlers are deliberate here.
ignore = ["BLE001"]
