readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "paramiko>=3.0.0",
  "PyYAML>=6.0",
  "requests>=2.28.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
network-ai = "run_agent:main"
