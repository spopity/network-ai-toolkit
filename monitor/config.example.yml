# Example config for router-agent
routers:
  - name: asus-router
    host: 192.168.1.1
    port: 22
    username: admin
    # Use one of: password, key_filename (key_filename strongly recommended)
    key_filename: /root/.ssh/id_ed25519

log_dir: logs
retention_days: 14          # daily (LLM-analyzed) records
check_retention_hours: 48   # 5-minute check records (gzipped, logs/checks/)
db_retention_days: 90       # Postgres: 5-minute snapshots, DNS lookups, traffic (pruned by the daily run;
                            # 0 = keep forever). Daily analyses, events and "first seen" data are kept.

llm:
  # tried in this order; the first backend that answers every prompt writes the
  # whole analysis (a backend that fails part-way is skipped, never mixed)
  order: [claude, gemini, ollama]
  claude:
    # Claude Code subscription via the Claude Agent SDK, like Tshoot's chat;
    # needs CLAUDE_CODE_OAUTH_TOKEN in .env (`claude setup-token`), skipped without it
    model: opus
    timeout: 180
  gemini:
    # GEMINI_API_KEY / GEMINI_MODEL / USE_GCP_GEMINI read from .env
    timeout: 20
  ollama:
    url: http://ollama-host:11434
    model: qwen3:8b
    timeout: 30

watchdog:
  ping_targets: ["1.1.1.1", "8.8.8.8"]
  ping_port: 443
  check_interval_seconds: 30
  down_threshold_seconds: 300
  restart_cooldown_seconds: 600
  wan_unit: 0
  log_file: logs/watchdog.log

dashboard:
  # TCP listener for the router's wan-event hook and Tshoot: bind the LAN address, not
  # 0.0.0.0/127.0.0.1 if Tailscale runs in userspace mode (every 127.0.0.1 port is
  # reachable from the tailnet there, bypassing the approval check below)
  host: 192.168.1.10
  port: 8080
  # Optional: listener for `tailscale serve` (trusted identity headers). Without it nobody
  # can approve Tshoot changes from the dashboard.
  # unix_socket: /run/network-ai/dashboard.sock
  # approvers:
  #   logins: [you@example.com]
  #   devices: [laptop, phone]    # tailscale device names; empty = any device of those logins

# Optional: AdGuardHome on the router. Per-device DNS lookups are pulled every
# 5-minute check (router_agent/dnslog.py) and archived in Postgres.
# adguard:
#   url: http://192.168.1.1:3000
#   credentials_file: /root/.config/adguardhome.cred   # lines: username=... / password=...
#   networks:            # client IP prefix -> network label
#     "192.168.1.": LAN
#     "192.168.52.": Guest
#     "192.168.107.": IoT
#   aliases:             # client IP -> name, for hosts the router only knows by vendor
#     "192.168.1.10": my-server

# Optional: per-device internet usage from the firmware's Traffic Analyzer
# (Traffic Analyzer > Statistic must be on). Read every 5-minute check
# (router_agent/traffic.py) and archived in Postgres. `true` reuses the adguard
# networks/aliases; or give them here as a mapping.
# traffic_analyzer: true

# Optional: never archive or show these DNS domains (and subdomains) / Traffic Analyzer apps.
# hidden:
#   domains: [example.com]
#   apps: [SomeApp]

# Optional: push notifications to a Telegram bot (router_agent/notify.py). Create a bot
# with @BotFather, put its token in .env as TELEGRAM_BOT_TOKEN, send the bot /start, then
# `python -m router_agent.notify --chat-id` prints the chat_id and `--test` sends a test.
# notify:
#   telegram:
#     chat_id: "123456789"
#   events: [wan, dns, new_device, firmware, upnp, monitor, anomaly, iot_lan, vpn]   # the default; add `daily` (LLM briefing summary), `report` (weekly/monthly report), `vpn_sessions` (every WireGuard connect/disconnect)
#   wan_min_downtime_seconds: 60                        # shorter outages are not pushed
#   timezone: Europe/Berlin                             # times in messages (default: host's)
#   dashboard_url: http://my-host.tailnet.ts.net:8080   # optional link under each message

# Optional: the dashboard's network map (Map tab) places devices in rooms by their name
# ("kitchen_Google-Home-Mini" -> Kitchen); phones/laptops go to Mobile, servers to Server,
# washer/dryer/boiler to Utility, mesh nodes to the room most of their devices are in.
# Pin anything here by device name, IP or MAC (case-insensitive).
# network_map:
#   rooms:
#     RT-AX52: Shed
#     "192.168.1.10": Server
#     Samsung-Washer: Bathroom

# Optional: monitor-the-monitor thresholds (router_agent/selfcheck.py; these are the defaults).
# Problems are pushed as `monitor` notifications, once when they start and once when fixed.
# monitor:
#   check_max_age_minutes: 20      # no successful 5-minute check for this long
#   daily_max_age_hours: 26        # no daily analysis (or the last one failed)
#   backup_dir: /var/backups/router
#   backup_max_age_hours: 26
#   disk_min_free_pct: 10
#   traffic_max_age_hours: 3     # Traffic Analyzer stopped writing
#   heartbeat_url: https://hc-ping.com/<uuid>   # external dead-man's switch, pinged while checks are fresh

# Remote access (router_agent/vpn.py), on by default; `vpn: false` turns it off. WireGuard
# sessions and new peers/networks, DDNS name == WAN IP. Country/ISP from the offline DB-IP
# Lite files in state/geoip/ (downloaded by the daily run).
# vpn:
#   ddns_host: myname.duckdns.org   # default: the router's ddns_hostname_x

# Router setup drift (router_agent/routersetup.py), on by default; `router_setup: false` turns it off.
# Every rule/redirect/cron job/process/script the check has seen on the router is remembered;
# one that disappears later -> self-check `router_setup` -> Telegram (`monitor`).
# Removed something on purpose? Ignore it (fnmatch patterns) or delete logs/.router_setup.json.
# router_setup:
#   ignore: ["cron:spdMerlin_*", "script:uiScribe"]

# Optional: unusual appliance behaviour (router_agent/anomaly.py; these are the defaults).
# Phones, tablets and computers and the Guest network are never checked.
# anomaly:
#   new_domains_per_hour: 4    # new base domains (example.com) within an hour
#   upload_min_mb: 100         # an upload burst must be at least this big ...
#   upload_factor: 10          # ... and this many times the device's usual hourly peak
#   min_history_hours: 72      # baseline needed before a device is judged
#   cooldown_hours: 24         # one alert per device and kind per day
#   ignore_devices: []         # device names or MACs that may do this

# Optional: IoT devices trying to open connections to the LAN (router_agent/iotlan.py).
# Needs the LOG rule from router/firewall-start on the router (IoT = br54, LAN = br0).
# Present (even empty: `iot_lan: {}`) = on; these are the defaults.
# iot_lan:
#   cooldown_hours: 24         # one alert per IoT device, LAN target and port per day
#   ignore_devices: []         # IoT device names, IPs or MACs that may do this
#   ignore_targets: []         # LAN side: "192.168.1.10", "192.168.1.10:1883" or "homeassistant:8123"
