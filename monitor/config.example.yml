# Example config for router-agent
routers:
  - name: asus-router
    host: 192.168.1.1
    port: 22
    username: admin
    # Use one of: password, key_filename (key_filename strongly recommended)
    key_filename: /root/.ssh/id_ed25519

log_dir: logs
retention_days: 14          # daily (LLM-analyzed) records
check_retention_hours: 48   # 5-minute check records (gzipped, logs/checks/)

llm:
  gemini:
    # GEMINI_API_KEY / GEMINI_MODEL / USE_GCP_GEMINI read from .env
    timeout: 20
  ollama:
    url: http://ollama-host:11434
    model: qwen3:8b
    timeout: 30

watchdog:
  ping_targets: ["1.1.1.1", "8.8.8.8"]
  ping_port: 443
  check_interval_seconds: 30
  down_threshold_seconds: 300
  restart_cooldown_seconds: 600
  wan_unit: 0
  log_file: logs/watchdog.log

dashboard:
  host: 0.0.0.0
  port: 8080
